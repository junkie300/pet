name: test

on:
  push:
    paths:
      - "etl/**"
      - "app/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "etl/**"
      - "app/**"
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      # ⚠️ 한때 "표준 라이브러리만 쓰므로 설치가 필요 없다"고 적혀 있었는데 **사실이 아니었다.**
      #    test_hospitals 는 pyproj 를, test_localdata 는 openpyxl 을 import 한다.
      #    워크플로가 한 번도 돈 적이 없어서(D-94) 아무도 몰랐다 — 첫 실행에서 6개가 깨졌다.
      - run: pip install -r requirements.txt
      - name: unittest
        run: python -m unittest discover -s tests -v

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Supabase 키 없이 빌드된다. 키가 비면 앱이 안내 화면을 띄우도록 돼 있다.
      - name: unit test
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: assemble debug
        run: ./gradlew --no-daemon assembleDebug
